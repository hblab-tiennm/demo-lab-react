name: tl03 Frontend CD

on:
  push:
    branches: [ "main" ] # Hoặc branch mà nhóm tl03 đang code

env:
  AWS_REGION: ap-southeast-1
  S3_BUCKET: tl03-frontend-dev-bucket
  DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Sync thư mục build (dist) lên S3 và xóa file cũ không còn tồn tại
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete 

      - name: CloudFront Invalidation
        run: |
          # Lệnh quan trọng nhất để xóa cache CloudFront
          aws cloudfront create-invalidation --distribution-id ${{ env.DIST_ID }} --paths "/*"